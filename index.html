<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="screen-orientation" content="portrait">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SIAL - Pasos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
/* V10 + V11: TODO GRANDE PAREJO */
body{font-family:system-ui,Arial;color:#0a2540;font-size:22px}
.app{min-height:100dvh;display:flex;flex-direction:column;background:#fff}
header{padding:8px 12px 6px;text-align:center;border-bottom:1px solid #e5e7eb;flex-shrink:0}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:#666;font-size:16px}
.tabs{display:flex;padding:8px 12px 0;gap:8px;flex-shrink:0}
.tabs button{flex:1;padding:12px;border:0;border-radius:10px;background:#e2e8f0;color:#334155;font-weight:900;font-size:22px}
.tabs button.active{background:#0a2540;color:#fff}
.contenido{flex:1;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.sec{display:flex;flex-direction:column;gap:8px}
label{font-weight:900;font-size:22px;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px;border:1.5px solid #dbe6f0;border-radius:10px;font-size:22px;background:#f3f8fc;outline:none}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 label{font-size:18px;text-align:center;white-space:nowrap}
.row3 input{padding:10px 2px;text-align:center;font-weight:900;font-size:22px}
/* CRONO = 0-0 DE ARRIBA EN BASKET = 56px */
.crono-solo{background:#0a2540;color:#fff;border-radius:14px;min-height:100px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.crono-solo .fase{font-size:16px;background:#ffb800;color:#000;padding:3px 12px;border-radius:20px;font-weight:900;margin-bottom:2px}
#tiempo{font-size:56px;font-weight:900;line-height:1;transition:font-size .3s}
#tiempo small{font-size:22px;color:#aad}
#tiempo.grande{font-size:140px}
#tiempo.grande small{font-size:56px}
.crono-btns{display:flex;gap:8px}
.btn{flex:1;padding:12px;border:0;border-radius:11px;font-weight:900;font-size:22px;cursor:pointer}
.btn-start{background:#22c55e;color:#fff}
.btn-stop{background:#f59e0b;color:#000}
.btn-reset{background:#e5e7eb;color:#111}
.btn-calc{background:#0a7cff;color:#fff;width:100%;padding:13px;border:0;border-radius:12px;font-weight:900;font-size:22px}
.btn-notas{background:#f1f5f9;border:1.5px dashed #94a3b8;color:#334155;width:100%;padding:9px;border-radius:10px;font-weight:900;font-size:22px}
#notasBoxA,#notasBoxB{display:none}
.result{background:#eaf7ff;border:2px solid #0a7cff;border-radius:12px;padding:8px;text-align:center;display:none;font-size:22px}
.result b{font-size:44px}
.small{font-size:18px;color:#666;text-align:center}
/* HISTORIAL COMPACTO V10 */
.historial{flex:0 0 auto;background:#f8fafc;border-radius:12px;padding:8px;display:flex;flex-direction:column}
.historial h3{margin:0;text-align:center;font-size:22px}
.tabla-wrap{max-height:140px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:22px;margin-top:4px}
th,td{border-bottom:1px solid #e2e8f0;padding:5px 4px;text-align:center;background:#fff}
/* BORRAR - ARREGLADO: YA NO flex:1, YA NO GIGANTE */
.btn-borrar{flex:0 0 auto !important;width:100%;margin-top:6px;padding:8px;border:0;border-radius:10px;background:#e5e7eb;color:#111;font-weight:900;font-size:18px;cursor:pointer}
.hidden{display:none!important}
#bloqueoRotacion{display:none;position:fixed;inset:0;background:#0a2540;color:#fff;z-index:9999;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
#bloqueoRotacion b{font-size:26px}
@media (orientation: landscape) and (max-height: 500px){ #bloqueoRotacion{display:flex} }
</style>
</head>
<body>
<div id="bloqueoRotacion"><div style="font-size:60px">📱↻</div><b>Gira tu celular a vertical</b><p style="color:#cbd5e1;margin:0">Esta app solo funciona en vertical</p></div>
<div class="app">
<header><h1>🚶 SIAL - PASOS</h1><p>Hoja de Anotación - Caminadora / Caminando</p></header>
<div class="tabs">
<button id="tabCaminadora" class="active" onclick="cambiar('caminadora')">🏃 CAMINADORA</button>
<button id="tabCaminando" onclick="cambiar('caminando')">🚶 CAMINANDO</button>
</div>
<div class="contenido">
<div id="secCaminadora" class="sec">
<div><label>Actividad / Máquina</label><select id="actCaminadora"><option>-- Elegir --</option><option>Caminadora</option><option>Caminadora inclinada</option><option>Elíptica</option></select></div>
<div class="row3"><div><label>NP</label><input id="npA" type="number" value="50"></div><div><label>Seg 50 pasos</label><input id="segA" type="number" placeholder="Ej: 28"></div><div><label>Tiempo Mov (min)</label><input id="tiempoA" type="number" placeholder="Ej: 30"></div></div>
<div><button class="btn-notas" onclick="toggleNotas('notasBoxA')">📝 Notas ▼</button><div id="notasBoxA"><textarea id="notasA" rows="2" placeholder="Escribe notas..."></textarea></div></div>
<div><button class="btn-calc" onclick="calcular('A')">CALCULAR PASOS</button><div id="resA" class="result" style="margin-top:6px"></div></div>
</div>
<div id="secCaminando" class="sec hidden">
<div><label>Actividad / Lugar</label><select id="actCaminando"><option>-- Elegir --</option><option>Caminando en parque</option><option>Caminando en calle</option><option>Caminando en casa</option><option>Caminando en trabajo</option></select></div>
<div class="crono-solo"><div id="faseTxt" class="fase">MOMENTO 1 - 50 PASOS</div><div id="tiempo">00:00<small>.0</small></div></div>
<div class="crono-btns"><button id="btnCrono" class="btn btn-start" onclick="accionCrono()">▶ INICIAR</button><button class="btn btn-reset" onclick="reiniciarCrono()">↺ REINICIAR</button></div>
<div class="small" id="cronoAyuda">Dale INICIAR, camina 50 pasos y dale DETENER</div>
<div class="row3"><div><label>NP</label><input id="npB" type="number" value="50"></div><div><label>Seg 50 pasos</label><input id="segB" type="number" placeholder="Auto"></div><div><label>Tiempo Mov (min)</label><input id="tiempoB" type="number" placeholder="Ej: 30"></div></div>
<div><button class="btn-notas" onclick="toggleNotas('notasBoxB')">📝 Notas ▼</button><div id="notasBoxB"><textarea id="notasB" rows="2" placeholder="Escribe notas..."></textarea></div></div>
<div><button class="btn-calc" onclick="calcular('B')">CALCULAR PASOS</button><div id="resB" class="result" style="margin-top:6px"></div></div>
</div>
<div class="historial"><h3>📋 Historial de hoy</h3><div class="tabla-wrap"><table><thead><tr><th>Modo</th><th>NP</th><th>Seg</th><th>Min</th><th>Pasos</th></tr></thead><tbody id="historial"></tbody></table></div><button class="btn-borrar" onclick="localStorage.removeItem('sial_pasos');location.reload()">🗑 Borrar historial</button></div>
</div>
</div>
<script>
function intentarBloquear(){try{if(screen.orientation && screen.orientation.lock){screen.orientation.lock('portrait').catch(()=>{});}}catch(e){}}
document.addEventListener('click', intentarBloquear, {once:true});
document.addEventListener('touchstart', intentarBloquear, {once:true});
window.addEventListener('load', intentarBloquear);
let fase=1, corriendo=false, acumulado=0, inicio=0, timer=null;
function fmt(ms){let s=ms/1000;let m=Math.floor(s/60);let ss=Math.floor(s%60);let d=Math.floor((ms%1000)/100);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'<small>.'+d+'</small>';}
function pintar(){let ahora=corriendo?acumulado+(Date.now()-inicio):acumulado;document.getElementById('tiempo').innerHTML=fmt(ahora);}
function agrandarCronoFinal(segFinal){
  let el=document.getElementById('tiempo');
  el.innerHTML=fmt(segFinal*1000);
  el.classList.add('grande');
  setTimeout(()=>{ el.classList.remove('grande'); }, 2500);
}
function accionCrono(){intentarBloquear();if(fase===1){if(!corriendo){corriendo=true;inicio=Date.now();timer=setInterval(pintar,100);document.getElementById('btnCrono').textContent='⏸ DETENER';document.getElementById('btnCrono').className='btn btn-stop';}else{let total=acumulado+(Date.now()-inicio);clearInterval(timer);corriendo=false;acumulado=0;let seg=(total/1000).toFixed(1);document.getElementById('segB').value=seg;fase=2;
  agrandarCronoFinal(total/1000);
  document.getElementById('faseTxt').textContent='MOMENTO 2 - TIEMPO CAMINANDO';document.getElementById('cronoAyuda').textContent='Ya quedó: '+seg+' seg - Ahora mide tu caminata';document.getElementById('btnCrono').textContent='▶ INICIAR';document.getElementById('btnCrono').className='btn btn-start';}}else{if(!corriendo){corriendo=true;inicio=Date.now();timer=setInterval(pintar,100);document.getElementById('btnCrono').textContent='⏸ PAUSA';document.getElementById('btnCrono').className='btn btn-stop';}else{acumulado+=(Date.now()-inicio);clearInterval(timer);corriendo=false;
  agrandarCronoFinal(acumulado/1000);
  document.getElementById('btnCrono').textContent='▶ INICIAR';document.getElementById('btnCrono').className='btn btn-start';}}}
function reiniciarCrono(){clearInterval(timer);corriendo=false;acumulado=0;fase=1;let el=document.getElementById('tiempo');el.classList.remove('grande');el.innerHTML='00:00<small>.0</small>';document.getElementById('faseTxt').textContent='MOMENTO 1 - 50 PASOS';document.getElementById('cronoAyuda').textContent='Dale INICIAR, camina 50 pasos y dale DETENER';document.getElementById('btnCrono').textContent='▶ INICIAR';document.getElementById('btnCrono').className='btn btn-start';}
function cambiar(m){let a=document.getElementById('secCaminadora');let b=document.getElementById('secCaminando');if(m==='caminadora'){a.classList.remove('hidden');b.classList.add('hidden');}else{b.classList.remove('hidden');a.classList.add('hidden');}document.getElementById('tabCaminadora').classList.toggle('active',m==='caminadora');document.getElementById('tabCaminando').classList.toggle('active',m==='caminando');}
function toggleNotas(boxId){let b=document.getElementById(boxId);b.style.display=b.style.display==='block'?'none':'block';}
function calcular(letra){let np=parseFloat(document.getElementById('np'+letra).value)||0;let seg=parseFloat(document.getElementById('seg'+letra).value)||0;let min=parseFloat(document.getElementById('tiempo'+letra).value)||0;if(!np||!seg||!min){alert('Llena NP, Seg 50 pasos y Tiempo en Movimiento');return;}let pasosMin=np/(seg/60);let total=Math.round(pasosMin*min);let res=document.getElementById('res'+letra);res.style.display='block';res.innerHTML='Pasos totales<br><b>'+total.toLocaleString()+'</b><br>'+Math.round(pasosMin)+' pasos / min &nbsp;|&nbsp; '+np+' pasos en '+seg+' seg';let h=JSON.parse(localStorage.getItem('sial_pasos')||'[]');h.unshift({modo:letra==='A'?'Caminadora':'Caminando',np,seg,min,pasos:total});localStorage.setItem('sial_pasos',JSON.stringify(h));mostrar();}
function mostrar(){let h=JSON.parse(localStorage.getItem('sial_pasos')||'[]');document.getElementById('historial').innerHTML=h.map(x=>'<tr><td>'+x.modo+'</td><td>'+x.np+'</td><td>'+x.seg+'</td><td>'+x.min+'</td><td><b>'+x.pasos.toLocaleString()+'</b></td></tr>').join('')||'<tr><td colspan="5" style="text-align:center">Sin registros aún</td></tr>';}
mostrar();
</script>
</body>
</html>
