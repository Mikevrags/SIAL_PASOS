<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SIAL - Pasos</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a2540;font-family:system-ui,Arial;color:#0a2540;font-size:17px}
.wrap{padding:10px;width:100%;max-width:100%;margin:0}
header{background:#fff;border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}
header h1{margin:0;font-size:22px;color:#0a2540}
header p{margin:4px 0 0;color:#555;font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:14px;border:0;border-radius:12px;background:#1e3a5f;color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.tabs button.active{background:#fff;color:#0a2540}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px}
label{font-weight:800;font-size:14px;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:13px;border:1.5px solid #dbe6f0;border-radius:10px;font-size:17px;background:#f3f8fc;outline:none}
input:focus{border-color:#0a7cff}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row3 input{padding:12px 8px;text-align:center;font-weight:700}
.small{font-size:12px;color:#666;margin-top:4px}
.crono-box{background:#0a2540;color:#fff;border-radius:12px;padding:14px;text-align:center;margin:12px 0}
.crono-box .fase{font-size:13px;background:#ffb800;color:#000;display:inline-block;padding:4px 10px;border-radius:20px;font-weight:800;margin-bottom:6px}
#tiempo{font-size:46px;font-weight:900;letter-spacing:1px;line-height:1}
#tiempo small{font-size:18px;color:#aad}
.crono-btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:15px;border:0;border-radius:11px;font-weight:900;font-size:16px;cursor:pointer}
.btn-start{background:#22c55e;color:#fff}
.btn-stop{background:#f59e0b;color:#000}
.btn-reset{background:#e5e7eb;color:#111}
.btn-calc{background:#0a7cff;color:#fff;width:100%;padding:16px;border:0;border-radius:12px;font-weight:900;font-size:18px;margin-top:10px}
.btn-notas{background:#eef2f7;border:1.5px dashed #94a3b8;color:#334155;width:100%;padding:12px;border-radius:10px;font-weight:800;margin-top:10px}
#notasBox{display:none;margin-top:8px}
.result{background:#eaf7ff;border:2px solid #0a7cff;border-radius:12px;padding:14px;text-align:center;display:none}
.result b{font-size:34px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
th,td{border-bottom:1px solid #eee;padding:8px 4px;text-align:left}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🚶 SIAL - PASOS</h1><p>Hoja de Anotación - Caminadora / Caminando</p></header>

<div class="tabs">
<button id="tabCaminadora" class="active" onclick="cambiar('caminadora')">🏃 CAMINADORA</button>
<button id="tabCaminando" onclick="cambiar('caminando')">🚶 CAMINANDO</button>
</div>

<!-- CAMINADORA -->
<div id="secCaminadora" class="card">
<label>Actividad / Máquina</label>
<select id="actCaminadora"><option>-- Elegir --</option><option>Caminadora</option><option>Caminadora inclinada</option><option>Elíptica</option></select>

<div style="margin-top:12px"><label>NP, Seg 50 Pasos y Tiempo en Movimiento</label>
<div class="row3">
<div><label>NP</label><input id="npA" type="number" value="50"></div>
<div><label>Seg 50 pasos</label><input id="segA" type="number" placeholder="Ej: 28"></div>
<div><label>Tiempo Mov (min)</label><input id="tiempoA" type="number" placeholder="Ej: 30"></div>
</div></div>

<button class="btn-notas" onclick="toggleNotas('notasBoxA','notasA')">📝 Notas ▼</button>
<div id="notasBoxA"><textarea id="notasA" rows="3" placeholder="Escribe notas..."></textarea></div>

<button class="btn-calc" onclick="calcular('A')">CALCULAR PASOS</button>
<div id="resA" class="result"></div>
</div>

<!-- CAMINANDO -->
<div id="secCaminando" class="card hidden">
<label>Actividad / Lugar</label>
<select id="actCaminando"><option>-- Elegir --</option><option>Caminando en parque</option><option>Caminando en calle</option><option>Caminando en casa</option><option>Caminando en trabajo</option></select>

<div class="crono-box">
<div id="faseTxt" class="fase">MOMENTO 1 - 50 PASOS</div>
<div id="tiempo">00:00<small>.0</small></div>
<div class="small" id="cronoAyuda">Dale INICIAR, camina 50 pasos y dale DETENER</div>
<div class="crono-btns">
<button id="btnCrono" class="btn btn-start" onclick="accionCrono()">▶ INICIAR</button>
<button class="btn btn-reset" onclick="reiniciarCrono()">↺ REINICIAR</button>
</div>
</div>

<div><label>NP, Seg 50 Pasos y Tiempo en Movimiento</label>
<div class="row3">
<div><label>NP</label><input id="npB" type="number" value="50"></div>
<div><label>Seg 50 pasos</label><input id="segB" type="number" placeholder="Auto"></div>
<div><label>Tiempo Mov (min)</label><input id="tiempoB" type="number" placeholder="Ej: 30"></div>
</div>
<div class="small">Al detener el Momento 1, los segundos se vacían solos en Seg 50 pasos. Tú pones manual el Tiempo en Movimiento al terminar.</div></div>

<button class="btn-notas" onclick="toggleNotas('notasBoxB','notasB')">📝 Notas ▼</button>
<div id="notasBoxB"><textarea id="notasB" rows="3" placeholder="Escribe notas..."></textarea></div>

<button class="btn-calc" onclick="calcular('B')">CALCULAR PASOS</button>
<div id="resB" class="result"></div>
</div>

<div class="card">
<h3 style="margin:0">📋 Historial de hoy</h3>
<table><thead><tr><th>Modo</th><th>NP</th><th>Seg</th><th>Min</th><th>Pasos</th></tr></thead><tbody id="historial"></tbody></table>
<button class="btn-reset btn" style="width:100%;margin-top:10px" onclick="localStorage.removeItem('sial_pasos');location.reload()">🗑 Borrar historial</button>
</div>
</div>

<script>
let fase=1, corriendo=false, acumulado=0, inicio=0, timer=null;
function fmt(ms){let s=ms/1000;let m=Math.floor(s/60);let ss=Math.floor(s%60);let d=Math.floor((ms%1000)/100);return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0')+'<small>.'+d+'</small>';}
function pintar(){let ahora=corriendo?acumulado+(Date.now()-inicio):acumulado;document.getElementById('tiempo').innerHTML=fmt(ahora);}
function accionCrono(){
  if(fase===1){
    if(!corriendo){corriendo=true;inicio=Date.now();timer=setInterval(pintar,100);document.getElementById('btnCrono').textContent='⏸ DETENER';document.getElementById('btnCrono').className='btn btn-stop';}
    else{ // DETENER - vacia a Seg 50 pasos
      let total=acumulado+(Date.now()-inicio);clearInterval(timer);corriendo=false;acumulado=0;
      let seg=(total/1000).toFixed(1);document.getElementById('segB').value=seg;
      fase=2;document.getElementById('tiempo').innerHTML='00:00<small>.0</small>';
      document.getElementById('faseTxt').textContent='MOMENTO 2 - TIEMPO CAMINANDO';
      document.getElementById('cronoAyuda').textContent='Ahora mide tu caminata. Puedes pausar y seguir las veces que ocupes. Seg 50 pasos ya quedó: '+seg+' seg';
      document.getElementById('btnCrono').textContent='▶ INICIAR';document.getElementById('btnCrono').className='btn btn-start';
    }
  }else{
    if(!corriendo){corriendo=true;inicio=Date.now();timer=setInterval(pintar,100);document.getElementById('btnCrono').textContent='⏸ PAUSA';document.getElementById('btnCrono').className='btn btn-stop';}
    else{acumulado+=(Date.now()-inicio);clearInterval(timer);corriendo=false;document.getElementById('btnCrono').textContent='▶ INICIAR';document.getElementById('btnCrono').className='btn btn-start';}
  }
}
function reiniciarCrono(){clearInterval(timer);corriendo=false;acumulado=0;fase=1;document.getElementById('tiempo').innerHTML='00:00<small>.0</small>';document.getElementById('faseTxt').textContent='MOMENTO 1 - 50 PASOS';document.getElementById('cronoAyuda').textContent='Dale INICIAR, camina 50 pasos y dale DETENER';document.getElementById('btnCrono').textContent='▶ INICIAR';document.getElementById('btnCrono').className='btn btn-start';}
function cambiar(m){document.getElementById('secCaminadora').classList.toggle('hidden',m!=='caminadora');document.getElementById('secCaminando').classList.toggle('hidden',m!=='caminando');document.getElementById('tabCaminadora').classList.toggle('active',m==='caminadora');document.getElementById('tabCaminando').classList.toggle('active',m==='caminando');}
function toggleNotas(boxId){let b=document.getElementById(boxId);b.style.display=b.style.display==='block'?'none':'block';}
function calcular(letra){
  let np=parseFloat(document.getElementById('np'+letra).value)||0;
  let seg=parseFloat(document.getElementById('seg'+letra).value)||0;
  let min=parseFloat(document.getElementById('tiempo'+letra).value)||0;
  if(!np||!seg||!min){alert('Llena NP, Seg 50 pasos y Tiempo en Movimiento');return;}
  let pasosMin=np/(seg/60);let total=Math.round(pasosMin*min);
  let res=document.getElementById('res'+letra);res.style.display='block';res.innerHTML='Pasos totales<br><b>'+total.toLocaleString()+'</b><br>'+Math.round(pasosMin)+' pasos / min &nbsp;|&nbsp; '+np+' pasos en '+seg+' seg';
  let h=JSON.parse(localStorage.getItem('sial_pasos')||'[]');h.unshift({modo:letra==='A'?'Caminadora':'Caminando',np,seg,min,pasos:total});localStorage.setItem('sial_pasos',JSON.stringify(h));mostrar();
}
function mostrar(){let h=JSON.parse(localStorage.getItem('sial_pasos')||'[]');document.getElementById('historial').innerHTML=h.map(x=>'<tr><td>'+x.modo+'</td><td>'+x.np+'</td><td>'+x.seg+'</td><td>'+x.min+'</td><td><b>'+x.pasos.toLocaleString()+'</b></td></tr>').join('')||'<tr><td colspan="5">Sin registros aún</td></tr>';}
mostrar();
</script>
</body>
</html>
