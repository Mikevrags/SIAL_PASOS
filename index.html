<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIAL - Pasos</title><meta name="theme-color" content="#0A2540"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#0A2540;color:#fff}.top{background:#fff;color:#0A2540;padding:14px;text-align:center;border-radius:0 0 20px 20px}.top h1{margin:0;font-size:24px}.top h1 span{color:#0A6CFF}.top p{margin:4px 0;color:#5b7a99;font-size:13px}.wrap{padding:14px;max-width:520px;margin:0 auto}.card{background:#fff;color:#111;border-radius:16px;padding:14px;margin-bottom:12px}label{font-size:13px;font-weight:700;color:#0A2540}input,select,textarea{width:100%;padding:11px;border:1.5px solid #dbe6f0;border-radius:10px;font-size:16px;margin:5px 0 10px;background:#f8fbff}.row{display:flex;gap:8px}.row>*{flex:1}button{border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800;cursor:pointer;width:100%}.b1{background:#0A6CFF;color:#fff}.b2{background:#2EC5FF;color:#00263d}.b3{background:#0A2540;color:#fff}.b4{background:#eef4ff;color:#0A2540}.modes{display:flex;gap:8px}.modes button{background:#eef4ff;color:#0A2540}.modes button.on{background:#0A2540;color:#fff}.kpi{display:flex;gap:8px}.kpi div{flex:1;background:#0A2540;color:#fff;border-radius:14px;padding:12px;text-align:center}.kpi b{font-size:22px;display:block}.kpi span{font-size:12px;opacity:.8}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px;border-bottom:1px solid #eee;text-align:center}th{background:#0A2540;color:#fff}.item{border:1px solid #e5eef7;border-radius:12px;padding:10px;margin-bottom:8px;background:#f8fbff}.small{font-size:12px;color:#666}.badge{display:inline-block;background:#2EC5FF;color:#00263d;padding:3px 8px;border-radius:20px;font-size:12px;font-weight:800}.chrono{font-size:42px;font-weight:900;text-align:center;color:#0A2540}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{background:#123a63;color:#fff}.tabs button.on{background:#fff;color:#0A2540}.hid{display:none}</style></head><body><div class="top"><div style="font-size:42px">🏀</div><h1><span>SIAL</span> • Pasos</h1><p>Caminadora / Caminando • 50 pasos base</p></div><div class="wrap"><div class="tabs"><button id="tC" class="on" onclick="sh('c')">📏 Calcular</button><button id="tH" onclick="sh('h')">📋 Historial</button><button id="tT" onclick="sh('t')">⚙️ Tabla</button></div><div id="vC"><div class="card"><label>Usuario</label><div class="row"><select id="u"></select><button class="b4" onclick="nu()">+ Nuevo</button></div><label>Modo</label><div class="modes"><button id="m1" class="on" onclick="md('Caminadora')">🏃 Caminadora</button><button id="m2" onclick="md('Caminando')">🚶 Caminando</button></div></div><div class="card" id="c1"><label>Velocidad (No.)</label><select id="vs" onchange="av()"></select><div class="row"><div><label>NP</label><input id="np" value="50" type="number"></div><div><label>Seg 50 pasos</label><input id="ec" value="42" type="number" step="0.1"></div></div><p class="small">(Tiempo Mov x 60 / Seg 50) x NP</p></div><div class="card hid" id="c2"><label>Cronómetro 50 pasos</label><div class="chrono" id="cr">00:00.0</div><div class="row"><button class="b2" id="bs" onclick="tc()">▶ INICIAR</button><button class="b3" onclick="rc()">↺ Reiniciar</button></div><label>Nombre medición</label><input id="nm" placeholder="Ej: Normal, Lento, Parque"><button class="b1" onclick="gm()">💾 Guardar medición</button><label>Guardadas</label><select id="ms" onchange="am()"></select><div class="row"><div><label>NP</label><input id="np2" value="50" type="number"></div><div><label>Seg 50 pasos</label><input id="ec2" type="number" step="0.1"></div></div></div><div class="card"><label>Tiempo en Movimiento (min)</label><input id="tm" type="number" step="0.1" placeholder="Ej: 30"><label>Notas</label><textarea id="nt" rows="2"></textarea><div class="kpi"><div><span>TPxMin</span><b id="k1">-</b></div><div><span>PxMin</span><b id="k2">-</b></div><div><span>PASOS</span><b id="k3">-</b></div></div><button class="b1" onclick="calc()" style="margin-top:10px">CALCULAR</button><button class="b2" onclick="save()" style="margin-top:8px">✅ GUARDAR REGISTRO</button><p class="small" id="ft"></p></div><div class="card"><b>Hoy • <span id="hu"></span></b><div class="kpi" style="margin-top:8px"><div><span>Pasos hoy</span><b id="ph">0</b></div><div><span>Registros</span><b id="rh">0</b></div></div></div></div><div id="vH" class="hid"><div class="card"><div class="row"><button class="b1" onclick="exp()">⬇ Excel</button><button class="b2" onclick="wa()">📲 WhatsApp</button></div><button class="b4" onclick="delAll()" style="margin-top:8px">🗑 Borrar todo</button></div><div id="lh"></div></div><div id="vT" class="hid"><div class="card"><p class="small">Edita segundos y guarda. Se queda en tu cel.</p><div id="te"></div><button class="b1" onclick="gt()">💾 Guardar tabla</button></div></div><p class="small" style="text-align:center;opacity:.7">SIAL • Sin internet • Guarda en tu celular</p></div><script>let modo='Caminadora';let td=[{n:1,v:1,s:42},{n:2,v:1.3,s:38},{n:3,v:1.5,s:36},{n:4,v:1.8,s:34},{n:5,v:2,s:32},{n:6,v:2.5,s:28},{n:7,v:3,s:25},{n:8,v:3.5,s:22},{n:9,v:4,s:20},{n:10,v:4.5,s:18}];let tb=JSON.parse(localStorage.getItem('sial_tb')||JSON.stringify(td));let us=JSON.parse(localStorage.getItem('sial_us')||'["Yo","Esposa"]');let rg=JSON.parse(localStorage.getItem('sial_rg')||'[]');let md2=JSON.parse(localStorage.getItem('sial_md')||'[]');let ti=null,st=0,el=0,run=false;function sh(t){['c','h','t'].forEach(x=>{document.getElementById('v'+x.toUpperCase()).classList.toggle('hid',x!==t);document.getElementById('t'+x.toUpperCase()).classList.toggle('on',x===t)});if(t==='h')rh2();if(t==='t')rt();}function md(m){modo=m;document.getElementById('m1').classList.toggle('on',m==='Caminadora');document.getElementById('m2').classList.toggle('on',m==='Caminando');document.getElementById('c1').classList.toggle('hid',m!=='Caminadora');document.getElementById('c2').classList.toggle('hid',m!=='Caminando');}function ru(){let s=document.getElementById('u');s.innerHTML=us.map(u=>`<option>${u}</option>`).join('');document.getElementById('hu').textContent=s.value;s.onchange=()=>{document.getElementById('hu').textContent=s.value;hoy();};}function nu(){let n=prompt('Nombre usuario / jugador:');if(!n)return;us.push(n);localStorage.setItem('sial_us',JSON.stringify(us));ru();}function cv(){let s=document.getElementById('vs');s.innerHTML=tb.map(r=>`<option value="${r.n}">No. ${r.n} - Vel ${r.v} - ${r.s} seg</option>`).join('');av();}function av(){let n=+document.getElementById('vs').value;let r=tb.find(x=>x.n===n);if(r){document.getElementById('np').value=50;document.getElementById('ec').value=r.s;}}function rt(){document.getElementById('te').innerHTML='<table><tr><th>No.</th><th>Vel</th><th>Seg</th></tr>'+tb.map((r,i)=>`<tr><td>${r.n}</td><td><input id="v${i}" value="${r.v}" type="number" step="0.1"></td><td><input id="s${i}" value="${r.s}" type="number" step="0.1"></td></tr>`).join('')+'</table>';}function gt(){tb=tb.map((r,i)=>({n:r.n,v:+document.getElementById('v'+i).value,s:+document.getElementById('s'+i).value}));localStorage.setItem('sial_tb',JSON.stringify(tb));cv();alert('Tabla guardada ✅');}function fm(ms){let s=ms/1000;let m=Math.floor(s/60);let sec=s%60;return String(m).padStart(2,'0')+':'+sec.toFixed(1).padStart(4,'0');}function tc(){if(!run){run=true;st=Date.now()-el;ti=setInterval(()=>{el=Date.now()-st;document.getElementById('cr').textContent=fm(el);},100);document.getElementById('bs').textContent='⏸ DETENER';}else{run=false;clearInterval(ti);document.getElementById('bs').textContent='▶ INICIAR';document.getElementById('ec2').value=(el/1000).toFixed(1);}}function rc(){run=false;clearInterval(ti);el=0;document.getElementById('cr').textContent='00:00.0';document.getElementById('bs').textContent='▶ INICIAR';}function rm(){let s=document.getElementById('ms');s.innerHTML='<option value="">-- Elegir --</option>'+md2.map((m,i)=>`<option value="${i}">${m.n} - ${m.s} seg</option>`).join('');}function gm(){let s=document.getElementById('ec2').value;let n=document.getElementById('nm').value||('Medición '+(md2.length+1));if(!s){alert('Primero mide');return;}md2.push({n:n,s:+s});localStorage.setItem('sial_md',JSON.stringify(md2));rm();alert('Guardada: '+n);}function am(){let i=document.getElementById('ms').value;if(i==='')return;document.getElementById('ec2').value=md2[i].s;document.getElementById('nm').value=md2[i].n;}function calc(){let tm=+document.getElementById('tm').value;let np,ec;if(modo==='Caminadora'){np=+document.getElementById('np').value;ec=+document.getElementById('ec').value;}else{np=+document.getElementById('np2').value;ec=+document.getElementById('ec2').value;}if(!tm||!ec){alert('Falta Tiempo Mov y Seg 50');return;}let tpx=tm*60;let px=tpx/ec;let tot=px*np;document.getElementById('k1').textContent=tpx.toFixed(0);document.getElementById('k2').textContent=px.toFixed(2);document.getElementById('k3').textContent=Math.round(tot).toLocaleString();document.getElementById('ft').textContent=`${tm} x 60 = ${tpx} / ${ec} = ${px.toFixed(2)} x ${np} = ${Math.round(tot)} pasos`;return{tm,np,ec,tpx,px,tot};}function save(){let c=calc();if(!c)return;let vel=modo==='Caminadora'?tb.find(x=>x.n===+document.getElementById('vs').value)?.v:'';let r={f:new Date().toLocaleDateString(),h:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),u:document.getElementById('u').value,m:modo,v:vel,n:document.getElementById('nm').value||'',np:c.np,ec:c.ec,tm:c.tm,tpx:c.tpx,px:+c.px.toFixed(2),tot:Math.round(c.tot),nt:document.getElementById('nt').value};rg.unshift(r);localStorage.setItem('sial_rg',JSON.stringify(rg));hoy();rh2();alert('Guardado ✅ '+r.tot.toLocaleString());}function hoy(){let h=new Date().toLocaleDateString();let u=document.getElementById('u').value;let f=rg.filter(r=>r.f===h&&r.u===u);document.getElementById('ph').textContent=f.reduce((a,b)=>a+b.tot,0).toLocaleString();document.getElementById('rh').textContent=f.length;}function rh2(){let e=document.getElementById('lh');if(!rg.length){e.innerHTML='<div class="card">Sin registros</div>';return;}e.innerHTML=rg.map((r,i)=>`<div class="item"><b>${r.tot.toLocaleString()} pasos</b> <span class="badge">${r.m}</span><br><span class="small">${r.f} ${r.h} - ${r.u} - Vel ${r.v||'-'} ${r.n?('- '+r.n):''}</span><br>50 pasos: ${r.ec} seg - Mov: ${r.tm} min - TPxMin ${r.tpx} - PxMin ${r.px}<br>${r.nt?('📝 '+r.nt+'<br>'):''}<button class="b4" onclick="del(${i})" style="padding:6px;margin-top:6px">Eliminar</button></div>`).join('');}function del(i){if(!confirm('¿Eliminar?'))return;rg.splice(i,1);localStorage.setItem('sial_rg',JSON.stringify(rg));rh2();hoy();}function delAll(){if(!confirm('¿Borrar TODO?'))return;rg=[];localStorage.setItem('sial_rg',JSON.stringify(rg));rh2();hoy();}function exp(){let csv='Fecha,Hora,Usuario,Modo,Velocidad,Nombre,NP,Seg50,TiempoMov,TPxMin,PxMin,Total,Notas\n'+rg.map(r=>[r.f,r.h,r.u,r.m,r.v,r.n,r.np,r.ec,r.tm,r.tpx,r.px,r.tot,'"'+(r.nt||'').replace(/"/g,'')+'"'].join(',')).join('\n');let b=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='SIAL_pasos.csv';a.click();}function wa(){let h=new Date().toLocaleDateString();let u=document.getElementById('u').value;let f=rg.filter(r=>r.f===h&&r.u===u);let t=f.reduce((a,b)=>a+b.tot,0);window.open('https://wa.me/?text='+encodeURIComponent(`SIAL Pasos ${h} - ${u}: ${t.toLocaleString()} pasos en ${f.length} registros.`),'_blank');}ru();cv();rm();rt();hoy();</script></body></html>
